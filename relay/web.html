<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Watch</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a65; --card:#fff; --line:#e6e3da;
          --accent:#c96442; --ok:#2f7d4f; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1e1d; --fg:#f0eee6; --muted:#a3a198; --card:#2a2927; --line:#3a3936; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; display:flex; gap:8px; align-items:center; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 0 10px; }
  .tool { font-weight:600; color:var(--accent); }
  .meta { color:var(--muted); font-size:12px; }
  pre { white-space:pre-wrap; word-break:break-word; margin:6px 0; font:13px/1.4 ui-monospace, monospace; }
  .row { display:flex; gap:8px; margin-top:8px; }
  button { flex:1; border:0; border-radius:10px; padding:12px; font-size:15px; font-weight:600; color:#fff; cursor:pointer; }
  .allow { background:var(--ok); } .deny { background:var(--bad); }
  .msg { white-space:pre-wrap; }
  .msg.user { border-left:3px solid var(--accent); }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:15px; }
  form button { flex:0 0 auto; background:var(--accent); }
  h2 { font-size:14px; color:var(--muted); margin:18px 0 8px; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1><span id="dot" class="dot"></span> Claude Watch</h1>
  <div id="perms"></div>
  <h2>Chat</h2>
  <form id="reply"><input id="text" placeholder="Antwort an Claude…" autocomplete="off"><button>Senden</button></form>
  <div id="msgs" style="margin-top:10px"></div>
</main>
<script>
  const qs = new URLSearchParams(location.search);
  let token = qs.get("token") || localStorage.getItem("cw-token") || "";
  if (!token) token = prompt("Relay-Token") || "";
  try { localStorage.setItem("cw-token", token); } catch (e) {}
  if (qs.has("token")) history.replaceState(null, "", location.pathname);

  const perms = new Map(), msgs = [];
  let last = 0;
  const api = (path, opts = {}) => fetch("/api" + path, {
    ...opts, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" }
  }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function render() {
    document.getElementById("perms").innerHTML = [...perms.values()].map(p => `
      <div class="card">
        <div><span class="tool">${esc(p.tool_name)}</span> <span class="meta">${esc(p.project)}</span></div>
        <pre>${esc(p.summary)}</pre>${p.detail ? `<pre class="meta">${esc(p.detail)}</pre>` : ""}
        <div class="row"><button class="deny" data-id="${p.id}" data-d="deny">Ablehnen</button>
        <button class="allow" data-id="${p.id}" data-d="allow">Erlauben</button></div>
      </div>`).join("");
    document.getElementById("msgs").innerHTML = msgs.slice().reverse().map(m => `
      <div class="card msg ${m.role}"><div class="meta">${esc(m.project || "")} · ${m.role}</div>${esc(m.text)}</div>`).join("");
  }

  document.getElementById("perms").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    api(`/permission/${b.dataset.id}/decision`, { method: "POST", body: JSON.stringify({ decision: b.dataset.d }) });
  });
  document.getElementById("reply").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("text");
    const session = [...msgs].reverse().find(m => m.session_id)?.session_id || "";
    if (!input.value.trim()) return;
    api("/reply", { method: "POST", body: JSON.stringify({ session_id: session, text: input.value }) });
    input.value = "";
  });

  function apply(ev) {
    if (ev.type === "permission") perms.set(ev.data.id, ev.data);
    if (ev.type === "resolved") perms.delete(ev.data.id);
    if (ev.type === "message") { msgs.push(ev.data); msgs.splice(0, msgs.length - 100); }
  }

  async function loop() {
    const dot = document.getElementById("dot");
    try {
      const s = await api("/state");
      perms.clear(); s.permissions.forEach(p => perms.set(p.id, p));
      msgs.length = 0; msgs.push(...s.messages); last = s.last; render();
      for (;;) {
        dot.classList.add("on");
        const r = await api(`/events?since=${last}&wait=50`);
        if (r.last < last) throw new Error("resync");
        r.events.forEach(apply); last = r.last; render();
      }
    } catch (e) {
      dot.classList.remove("on");
      setTimeout(loop, 3000);
    }
  }
  loop();
</script>
</body>
</html>
